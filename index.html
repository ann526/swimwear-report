<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAI Swimwear · 週銷量報表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0f172a;
    --ink2: #475569;
    --ink3: #94a3b8;
    --surface: #f8f9fb;
    --card: #ffffff;
    --border: #e2e8f0;
    --accent: #6366f1;
    --accent-light: #eef2ff;
    --accent2: #818cf8;
    --top: #e0f2fe;
    --top-text: #0369a1;
    --bot: #fce7f3;
    --bot-text: #9d174d;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--surface);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: var(--ink);
    color: #f8fafc;
    padding: 20px 24px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(15,23,42,.18);
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .header-title { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .header-badge {
    font-size: 10px; font-weight: 600; color: #64748b;
    background: #1e293b; padding: 3px 8px; border-radius: 4px;
  }
  .week-tabs {
    display: flex; gap: 3px; overflow-x: auto;
    scrollbar-width: none;
  }
  .week-tabs::-webkit-scrollbar { display: none; }
  .week-tab {
    padding: 8px 14px; border: none; border-radius: 6px 6px 0 0;
    cursor: pointer; font-size: 12px; font-weight: 600;
    white-space: nowrap; transition: all .15s;
    background: transparent; color: #64748b;
  }
  .week-tab.active { background: var(--surface); color: var(--ink); }

  /* ── Cat tabs ── */
  .cat-bar {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 0 24px; display: flex; gap: 2px; overflow-x: auto;
    scrollbar-width: none;
  }
  .cat-bar::-webkit-scrollbar { display: none; }
  .cat-tab {
    padding: 10px 14px; border: none; border-bottom: 2px solid transparent;
    cursor: pointer; font-size: 13px; font-weight: 600;
    white-space: nowrap; background: transparent; color: var(--ink3);
    transition: all .15s;
  }
  .cat-tab.active { border-bottom-color: var(--accent); color: var(--accent); }

  /* ── Filters ── */
  .filters {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .filter-input, .filter-select {
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px; font-family: inherit; outline: none; background: var(--card);
    color: var(--ink);
  }
  .filter-input { width: 130px; }
  .size-btns { display: flex; gap: 3px; flex-wrap: wrap; }
  .size-btn {
    padding: 4px 9px; border: 1px solid var(--border); border-radius: 5px;
    cursor: pointer; font-size: 11px; font-weight: 600;
    background: var(--card); color: var(--ink2); font-family: inherit;
    transition: all .15s;
  }
  .size-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .summary {
    margin-left: auto; font-size: 13px; color: var(--ink2);
    white-space: nowrap;
  }
  .summary b { color: var(--ink); }
  .summary .hi { color: var(--accent); }

  /* ── Items ── */
  .list { padding: 14px 24px; display: flex; flex-direction: column; gap: 7px; }

  .item-card {
    background: var(--card); border-radius: 10px;
    border: 1px solid var(--border); overflow: hidden;
    transition: box-shadow .15s;
  }
  .item-card:hover { box-shadow: 0 2px 12px rgba(99,102,241,.08); }

  .item-main {
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  }
  .item-id { width: 110px; flex-shrink: 0; }
  .item-code { font-weight: 700; font-size: 15px; }
  .item-badge {
    display: inline-block; margin-top: 3px;
    padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700;
  }
  .item-bar { flex: 1; }
  .bar-track {
    height: 9px; background: #f1f5f9; border-radius: 5px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 5px; transition: width .4s ease;
  }
  .item-qty { width: 58px; text-align: right; flex-shrink: 0; }
  .qty-num { font-weight: 800; font-size: 17px; }
  .qty-unit { font-size: 11px; color: var(--ink3); margin-left: 2px; }
  .item-tb { width: 100px; flex-shrink: 0; display: flex; gap: 5px; }
  .tb-badge {
    font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 700;
  }
  .tb-top { background: var(--top); color: var(--top-text); }
  .tb-bot { background: var(--bot); color: var(--bot-text); }
  .item-avg { width: 68px; flex-shrink: 0; text-align: right; }
  .avg-label { font-size: 10px; color: var(--ink3); }
  .avg-num { font-size: 13px; font-weight: 700; color: var(--ink2); }
  .item-btns { display: flex; gap: 3px; flex-shrink: 0; }
  .expand-btn {
    padding: 3px 8px; border: 1px solid var(--border); border-radius: 5px;
    cursor: pointer; font-size: 11px; font-weight: 600;
    background: #f8f9fb; color: var(--ink2); font-family: inherit;
    transition: all .15s;
  }
  .expand-btn.active {
    background: var(--accent-light); border-color: var(--accent); color: var(--accent);
  }

  /* ── Expand panels ── */
  .expand-panel {
    border-top: 1px solid #f1f5f9; padding: 10px 16px; background: #fafafa;
    display: none;
  }
  .expand-panel.open { display: block; }
  .panel-label {
    font-size: 10px; color: var(--ink3); font-weight: 700;
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 11px; min-width: 64px; text-align: center;
  }
  .chip-num { font-weight: 800; font-size: 15px; }
  .chip-label { font-size: 11px; color: var(--accent); font-weight: 700; }
  .chip-pct { font-size: 10px; color: var(--ink3); }

  /* ── Empty ── */
  .empty {
    text-align: center; padding: 60px; color: var(--ink3); font-size: 15px;
  }

  @media (max-width: 600px) {
    .header { padding: 14px 16px 0; }
    .list { padding: 12px 16px; }
    .filters { padding: 8px 16px; }
    .cat-bar { padding: 0 16px; }
    .item-avg { display: none; }
    .item-id { width: 90px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span class="header-title">HAI Swimwear · 週銷量報表</span>
    <span class="header-badge">Paid at · 台灣時間</span>
  </div>
  <div class="week-tabs" id="weekTabs"></div>

  </select>
  <div class="size-btns" id="sizeBtns"></div>
  <div class="summary" id="summary"></div>
</div>

<div class="list" id="itemList"></div>

const SIZE_ORDER = ["XS","S","M","L","XL","XXL","F"];
const CAT_TABS = ["全部","泳裝正線","Junior線","泳裝配件","洋裝"];
const CAT_MAP = {"全部":null,"泳裝正線":["正線一件式","正線兩件式"],"Junior線":["Junior"],"泳裝配件":["泳裝配件"],"洋裝":["洋裝","特殊洋裝"]};
const BADGE = {
  "正線一件式":{l:"一件式",bg:"#dbeafe",c:"#1e40af"},
  "正線兩件式":{l:"兩件式",bg:"#ede9fe",c:"#5b21b6"},
  "Junior":{l:"Junior",bg:"#fce7f3",c:"#9d174d"},
  "泳裝配件":{l:"配件",bg:"#d1fae5",c:"#065f46"},
  "洋裝":{l:"洋裝",bg:"#fef3c7",c:"#92400e"},
  "特殊洋裝":{l:"特殊洋裝",bg:"#ffedd5",c:"#9a3412"},
};

let curWeek = DB.weeks[DB.weeks.length - 1];
let curCat = "全部";
let curSize = "";
let expanded = {};

// Build week tabs
const weekTabsEl = document.getElementById('weekTabs');
DB.weeks.forEach(w => {
  const btn = document.createElement('button');
  btn.className = 'week-tab' + (w === curWeek ? ' active' : '');
  btn.textContent = DB.week_labels[w];
  btn.onclick = () => { curWeek = w; expanded = {}; updateWeekTabs(); render(); };
  weekTabsEl.appendChild(btn);
});

function updateWeekTabs() {
  weekTabsEl.querySelectorAll('.week-tab').forEach((btn, i) => {
    btn.classList.toggle('active', DB.weeks[i] === curWeek);
  });
}

// Build cat tabs
const catBarEl = document.getElementById('catBar');
CAT_TABS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'cat-tab' + (t === curCat ? ' active' : '');
  btn.textContent = t;
  btn.onclick = () => { curCat = t; updateCatTabs(); render(); };
  catBarEl.appendChild(btn);
});

function updateCatTabs() {
  catBarEl.querySelectorAll('.cat-tab').forEach((btn, i) => {
    btn.classList.toggle('active', CAT_TABS[i] === curCat);
  });
}

// Build size buttons
const sizeBtnsEl = document.getElementById('sizeBtns');
["","XS","S","M","L","XL","XXL","F"].forEach(sz => {
  const btn = document.createElement('button');
  btn.className = 'size-btn' + (sz === curSize ? ' active' : '');
  btn.textContent = sz || '全';
  btn.onclick = () => { curSize = sz; updateSizeBtns(); render(); };
  sizeBtnsEl.appendChild(btn);
});

function updateSizeBtns() {
  sizeBtnsEl.querySelectorAll('.size-btn').forEach((btn, i) => {
    const sizes = ["","XS","S","M","L","XL","XXL","F"];
    btn.classList.toggle('active', sizes[i] === curSize);
  });
}

function getItems() {
  const weekData = DB.data[curWeek] || {};
  const cats = CAT_MAP[curCat];
  const search = document.getElementById('searchInput').value.toLowerCase();
  const colorF = document.getElementById('colorSelect').value;

  return Object.entries(weekData)
    .filter(([ic, d]) => {
      if (cats && !cats.includes(d.cat)) return false;
      if (search && !ic.toLowerCase().includes(search)) return false;
      if (colorF && !d.colors[colorF]) return false;
      if (curSize && !d.sizes[curSize]) return false;
      return true;
    })
    .map(([ic, d]) => ({ ic, ...d }))
    .sort((a, b) => b.total - a.total);
}

function updateColorSelect() {
  const weekData = DB.data[curWeek] || {};
  const colors = new Set();
  Object.values(weekData).forEach(d => Object.keys(d.colors).forEach(c => colors.add(c)));
  const sel = document.getElementById('colorSelect');
  const cur = sel.value;
  sel.innerHTML = '<option value="">所有顏色</option>';
  [...colors].sort().forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    if (c === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

function render() {
  updateColorSelect();
  const items = getItems();
  const grandTotal = items.reduce((s, d) => s + d.total, 0);
  const maxTotal = Math.max(...items.map(d => d.total), 1);

  document.getElementById('summary').innerHTML =
    `<b>${items.length}</b> 款・合計 <b class="hi">${grandTotal}</b> 件/套・日均 <b>${(grandTotal/7).toFixed(1)}</b>`;

  const list = document.getElementById('itemList');
  if (items.length === 0) {
    list.innerHTML = '<div class="empty">沒有符合條件的品項</div>';
    return;
  }

  list.innerHTML = items.map(d => {
    const badge = BADGE[d.cat] || {l:d.cat,bg:"#f1f5f9",c:"#475569"};
    const isTwo = d.cat === "正線兩件式";
    const isJr = d.cat === "Junior";
    const barPct = (d.total / maxTotal * 100).toFixed(1);
    const expC = expanded[d.ic + '_c'];
    const expS = expanded[d.ic + '_s'];

    const colorF = document.getElementById('colorSelect').value;
    const colorEntries = colorF
      ? Object.entries(d.colors).filter(([c]) => c === colorF)
      : Object.entries(d.colors).sort((a,b) => b[1]-a[1]);
    const sizeEntries = curSize
      ? Object.entries(d.sizes).filter(([s]) => s === curSize)
      : Object.entries(d.sizes).sort((a,b) => SIZE_ORDER.indexOf(a[0]) - SIZE_ORDER.indexOf(b[0]));

    const tbHtml = (isTwo || isJr) ? `
      <div class="item-tb">
        <span class="tb-badge tb-top">上 ${d.T}</span>
        <span class="tb-badge tb-bot">下 ${d.B}</span>
      </div>` : '';

    const colorChips = colorEntries.map(([c, qty]) => `
      <div class="chip">
        <div class="chip-num">${qty}</div>
        <div class="chip-label">${c}</div>
      </div>`).join('');

    const sizeChips = sizeEntries.map(([sz, qty]) => {
      const pct = d.total > 0 ? Math.round(qty / d.total * 100) : 0;
      return `<div class="chip">
        <div class="chip-num">${qty}</div>
        <div class="chip-label">${sz}</div>
        <div class="chip-pct">${pct}%</div>
      </div>`;
    }).join('');

    return `
    <div class="item-card">
      <div class="item-main">
        <div class="item-id">
          <div class="item-code">${d.ic}</div>
          <span class="item-badge" style="background:${badge.bg};color:${badge.c}">${badge.l}</span>
        </div>
        <div class="item-bar">
          <div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div>
        </div>
        <div class="item-qty">
          <span class="qty-num">${d.total}</span><span class="qty-unit">${d.unit}</span>
        </div>
        ${tbHtml}
        <div class="item-avg">
          <div class="avg-label">日均</div>
          <div class="avg-num">${(d.total/7).toFixed(2)}</div>
        </div>
        <div class="item-btns">
          <button class="expand-btn ${expC?'active':''}" onclick="toggle('${d.ic}','c')">顏色</button>
          <button class="expand-btn ${expS?'active':''}" onclick="toggle('${d.ic}','s')">尺寸</button>
        </div>
      </div>
      <div class="expand-panel ${expC?'open':''}">
        <div class="panel-label">顏色銷量（本週）</div>
        <div class="chips">${colorChips}</div>
      </div>
      <div class="expand-panel ${expS?'open':''}">
        <div class="panel-label">尺寸銷量（本週）</div>
        <div class="chips">${sizeChips}</div>
      </div>
    </div>`;
  }).join('');
}

function toggle(ic, key) {
  expanded[ic + '_' + key] = !expanded[ic + '_' + key];
  render();
}

render();
</script>
